defaults:
  - task: rlbench_icl/insert_onto_square_peg

name: train_prompt_dp3

# ---------------------------------------------------------------- ICL prompt
# length of the object-trajectory prompt (uniformly resampled poses)
prompt_length: 16
# other_episode (ICL) | self | shuffled | wrong_task | zero
#   other_episode : prompt = another episode of the SAME task       (B)
#   wrong_task    : prompt = an episode of a DIFFERENT task         (C)
#   zero          : no prompt information at all                    (A-ish)
prompt_mode: other_episode

# where scripts/sbatch_gen_demonstration.sh wrote the zarr datasets
# (override on the CLI: data_root=/path/to/rlbench_zarr)
data_root: /home/nas_main/hyojinjang/data/spot/rlbench_zarr
mesh_root: /home/nas_main/hyojinjang/data/spot/mesh


task_name: ${task.name}
shape_meta: ${task.shape_meta}
exp_name: "debug"

horizon: 4 #8 #4
n_obs_steps: 1 #4 #2
n_action_steps: 4
n_latency_steps: 0
dataset_obs_steps: ${n_obs_steps}
keypoint_visible_rate: 1.0
obs_as_global_cond: True

pose_estimation:
  mesh_dir: "${mesh_root}/${task.task_name}/"

policy:
  _target_: diffusion_policy_3d.policy.prompt_simple_dp3.PromptSimpleDP3
  use_point_crop: true
  condition_type: film
  use_down_condition: true
  use_mid_condition: true
  use_up_condition: true
  # !! OFF on purpose: with language the policy can identify the task without
  # reading the trajectory prompt, which is exactly what we want to measure.
  use_lang_emb: false
  use_stage_emb: false
  use_progress: true

  # trajectory prompt encoder
  prompt_length: ${prompt_length}
  prompt_state_dim: 7
  prompt_dim: 128
  prompt_hidden_dim: 256
  
  diffusion_step_embed_dim: 128
  down_dims:
  - 128
  - 256
  - 384
  crop_shape:
  - 80
  - 80
  encoder_output_dim: 64
  horizon: ${horizon}
  kernel_size: 5
  n_action_steps: ${n_action_steps}
  n_groups: 8
  n_obs_steps: ${n_obs_steps}

  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: sample


  num_inference_steps: 10
  obs_as_global_cond: true
  shape_meta: ${shape_meta}



  # whether to use point cloud's color
  use_pc_color: false
  # type of pointnet
  pointnet_type: "pointnet"


  pointcloud_encoder_cfg:
    in_channels: 3
    out_channels: ${policy.encoder_output_dim}
    use_layernorm: true
    final_norm: layernorm # layernorm, none
    normal_channel: false


ema:
  _target_: diffusion_policy_3d.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: False

val_dataloader:
  batch_size: 128
  num_workers: 8
  shuffle: False
  pin_memory: True
  persistent_workers: False

optimizer:
  _target_: torch.optim.AdamW
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

training:
  device: "cuda:0"
  seed: 42
  debug: False
  resume: True
  lr_scheduler: cosine
  lr_warmup_steps: 500
  num_epochs: 10001 #3000
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 200
  checkpoint_every: 1000 #200
  val_every: 100 #1
  sample_every: 5
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

logging:
  group: ${exp_name}
  id: null
  mode: online
  name: ${task.task_name}_${prompt_mode}_${training.seed}
  project: dp3-icl-${task.name}
  resume: true
  tags:
  - dp3


checkpoint:
  save_ckpt: True #False # if True, save checkpoint every checkpoint_every
  topk:
    monitor_key: test_mean_score
    mode: max
    k: 1
    format_str: 'epoch={epoch:04d}-test_mean_score={test_mean_score:.3f}.ckpt'
  save_last_ckpt: True # this only saves when save_ckpt is True
  save_last_snapshot: False

multi_run:
  run_dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  wandb_name_base: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
  sweep:
    dir: outputs/${now:%Y.%m.%d}/${now:%H.%M.%S}_${name}_${task_name}
    subdir: ${hydra.job.num}


evaluation:
  eval_epoch: null