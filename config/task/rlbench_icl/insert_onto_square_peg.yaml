# Single-task ICL smoke test (Step 3).
#
# NOTE: with a single task the policy has no incentive to read the prompt
# ("I always do insert_onto_square_peg anyway"), so this config only verifies
# that the plumbing works. The real result starts at rlbench_icl_multi.
name: rlbench
task_name: insert_onto_square_peg

shape_meta: &shape_meta
  # acceptable types: rgb, low_dim
  obs:
    point_cloud:
      shape: [1024, 3]
      type: point_cloud
    agent_pos:
      shape: [7]
      type: low_dimx
    demo_traj:
      shape: ["${prompt_length}", 7]
      type: low_dimx
  action:
    shape: [8]

env_runner:
  _target_: env_rlbench.runner.rlbench_runner.RLBenchRunner
  root_dir: "/tmp/rlbench_zarr/test/${task.task_name}/all_variations/"
  task_name: ${task.task_name}

  has_lang_emb: False
  has_stage_emb: False
  enable_stage: False
  use_fp: True
  fp_cam_name: cam_wrist
  pose_estimation_wrapper: null

  # object trajectory used as the in-context prompt during rollout
  # (build it with tools/export_prompt_traj.py)
  prompt_path: "prompts/${task.task_name}/demo_000.npy"
  prompt_length: ${prompt_length}

dataset:
  _target_: diffusion_policy_3d.dataset.rlbench_icl_dataset.RLBenchICLDataset
  root_dir: "/tmp/rlbench_zarr/train/${task.task_name}/all_variations/"

  horizon: 4
  pad_before: 1
  pad_after: 4
  seed: 42
  val_ratio: 0.1
  max_train_episodes: 100
  has_lang_emb: False
  has_stage_emb: False

  # MVP: keep augmentation off, the prompt and the execution episode would be
  # augmented independently otherwise
  random_aug: False
  symmetric_axis: null

  prompt_length: ${prompt_length}
  prompt_mode: ${prompt_mode}
